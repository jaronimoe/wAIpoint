  :root {
    --surface: #F5F4F0;
    --surface-raised: #FFFFFF;
    --border: #E0DED8;
    --text-1: #2A2A2A;
    --text-2: #6B6965;
    --text-3: #9B9790;
    --accent: #2A7C7A;
    --accent-dim: #E5F0EF;
    --done: #3B8F72;
    --done-dim: #E5F2EC;
    --current: #B87A2E;
    --current-dim: #FDF3E4;
    --blocked: #BF4E4E;
    --blocked-dim: #FCEAEA;
    --bar-track: #E0DED8;
    --bar-fill: #2A7C7A;
    --column-bg: #ECEAE4;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --surface: #1A1C20;
      --surface-raised: #24262B;
      --border: #35373D;
      --text-1: #DDDCD9;
      --text-2: #9A9893;
      --text-3: #6B6964;
      --accent: #4AADA9;
      --accent-dim: #1C3332;
      --done: #5BB892;
      --done-dim: #1A332A;
      --current: #D9A050;
      --current-dim: #33291A;
      --blocked: #D87070;
      --blocked-dim: #331C1C;
      --bar-track: #35373D;
      --bar-fill: #4AADA9;
      --column-bg: #202227;
    }
  }
  :root[data-theme="dark"] {
    --surface: #1A1C20;
    --surface-raised: #24262B;
    --border: #35373D;
    --text-1: #DDDCD9;
    --text-2: #9A9893;
    --text-3: #6B6964;
    --accent: #4AADA9;
    --accent-dim: #1C3332;
    --done: #5BB892;
    --done-dim: #1A332A;
    --current: #D9A050;
    --current-dim: #33291A;
    --blocked: #D87070;
    --blocked-dim: #331C1C;
    --bar-track: #35373D;
    --bar-fill: #4AADA9;
    --column-bg: #202227;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: var(--surface);
    color: var(--text-1);
    font-family: 'Outfit', system-ui, -apple-system, sans-serif;
    font-weight: 400;
    line-height: 1.5;
    display: flex;
    flex-direction: column;
  }
  .topbar { flex-shrink: 0; padding: 1.5rem 1.5rem 0; }
  header { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 1.25rem; }
  .logo { font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 1.35rem; color: var(--accent); letter-spacing: -0.02em; }
  .generated { font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; color: var(--text-3); }
  .statsbar { display: flex; align-items: center; gap: 1rem 2rem; padding-bottom: 1.25rem; border-bottom: 1px solid var(--border); flex-wrap: wrap; }
  .stats { display: flex; gap: 2rem; flex-wrap: wrap; }
  .controls { display: flex; align-items: center; gap: 0.75rem; margin-left: auto; }
  .ctl { display: inline-flex; align-items: center; gap: 0.35rem; font-size: 0.8rem; color: var(--text-2); cursor: pointer; user-select: none; }
  .ctl input { accent-color: var(--accent); margin: 0; cursor: pointer; }
  .ctl-btn { font: inherit; font-size: 0.78rem; color: var(--text-2); background: var(--surface-raised); border: 1px solid var(--border); border-radius: 4px; padding: 0.2rem 0.6rem; cursor: pointer; }
  .ctl-btn:hover { color: var(--accent); border-color: var(--accent); }
  .ctl-btn[disabled] { opacity: 0.5; cursor: default; }
  .stat { display: flex; align-items: baseline; gap: 0.4rem; }
  .stat-value { font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 1.1rem; font-variant-numeric: tabular-nums; color: var(--text-1); }
  .stat-label { font-size: 0.82rem; color: var(--text-3); text-transform: uppercase; letter-spacing: 0.04em; }

  .board { flex: 1; overflow-x: auto; overflow-y: hidden; display: flex; gap: 1rem; padding: 1.25rem 1.5rem 1.5rem; align-items: flex-start; }
  .board::-webkit-scrollbar { height: 8px; }
  .board::-webkit-scrollbar-track { background: transparent; }
  .board::-webkit-scrollbar-thumb { background: var(--border); border-radius: 4px; }

  .project-col {
    flex: 0 0 340px;
    min-width: 340px;
    max-height: 100%;
    background: var(--column-bg);
    border-radius: 8px;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .project-col-header { flex-shrink: 0; padding: 1rem 1rem 0.75rem; }
  .project-col-body { flex: 1; overflow-y: auto; padding: 0 0.75rem 0.75rem; }
  .project-col-body::-webkit-scrollbar { width: 5px; }
  .project-col-body::-webkit-scrollbar-track { background: transparent; }
  .project-col-body::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }

  .project-header { display: flex; align-items: baseline; gap: 0.6rem; margin-bottom: 0.2rem; flex-wrap: wrap; }
  .project-name { font-family: 'JetBrains Mono', monospace; font-weight: 600; font-size: 1.05rem; margin: 0; letter-spacing: -0.01em; }
  .project-desc { color: var(--text-2); font-size: 0.85rem; margin: 0.15rem 0 0.5rem; }
  .project-meta { display: flex; align-items: center; gap: 0.6rem; flex-wrap: wrap; }
  .repo-link { font-family: 'JetBrains Mono', monospace; font-size: 0.72rem; color: var(--accent); text-decoration: none; }
  .repo-link:hover { text-decoration: underline; }
  .badge { display: inline-block; font-family: 'JetBrains Mono', monospace; font-size: 0.65rem; font-weight: 500; padding: 0.15em 0.5em; border-radius: 3px; text-transform: uppercase; letter-spacing: 0.04em; line-height: 1.4; }
  .badge-active { background: var(--done-dim); color: var(--done); }
  .badge-paused { background: var(--current-dim); color: var(--current); }
  .badge-completed { background: var(--accent-dim); color: var(--accent); }
  .badge-archived { background: var(--border); color: var(--text-3); }
  .badge-planned { background: var(--accent-dim); color: var(--accent); }
  .badge-in-progress { background: var(--current-dim); color: var(--current); }
  .badge-blocked { background: var(--blocked-dim); color: var(--blocked); }
  .badge-done { background: var(--done-dim); color: var(--done); }
  .tag { font-size: 0.68rem; color: var(--text-3); border: 1px solid var(--border); padding: 0.1em 0.4em; border-radius: 3px; }
  .wp { background: var(--surface-raised); border: 1px solid var(--border); border-radius: 5px; padding: 0.75rem 0.85rem; margin-bottom: 0.5rem; }
  /* The summary carries the header *and* the progress bar, so a collapsed work
     package still reports its status and how far along it is. */
  .wp-summary { list-style: none; cursor: pointer; display: flex; align-items: flex-start; gap: 0.4rem; }
  .wp-summary::-webkit-details-marker { display: none; }
  .wp-summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 3px; }
  .wp-summary-main { flex: 1 1 auto; min-width: 0; }
  .wp:not([open]) .progress-row { margin-bottom: 0; }
  /* Own column rather than a flex item in .wp-header: a name long enough to
     wrap would otherwise leave the marker alone on the first line. */
  .chev { flex-shrink: 0; margin-top: 0.42rem; width: 0; height: 0; border-top: 0.26rem solid transparent; border-bottom: 0.26rem solid transparent; border-left: 0.36rem solid var(--text-3); transition: transform 0.12s ease; }
  .wp[open] > .wp-summary .chev { transform: rotate(90deg); }
  .wp-summary:hover .chev { border-left-color: var(--accent); }
  .wp-header { display: flex; align-items: baseline; gap: 0.5rem; flex-wrap: wrap; margin-bottom: 0.1rem; }
  .wp-name { font-family: 'JetBrains Mono', monospace; font-weight: 500; font-size: 0.88rem; margin: 0; }
  .wp-desc { font-size: 0.78rem; color: var(--text-3); margin: 0 0 0.6rem; }
  .wp-notes { font-size: 0.75rem; color: var(--text-2); margin: 0 0 0.6rem; padding-left: 0.5rem; border-left: 2px solid var(--border); line-height: 1.4; }
  .wp-blocker { display: block; font-family: 'JetBrains Mono', monospace; font-size: 0.66rem; color: var(--blocked); }

<body>
<div class="topbar">
  <header>
    <span class="logo">wAIpoint</span>
    <span class="generated" id="generated"></span>
  </header>
  <div class="statsbar">
    <div class="stats" id="stats"></div>
    <div class="controls">
      <button class="ctl-btn" type="button" id="archiveBtn" hidden></button>
      <label class="ctl" title="Hide done and dropped tasks"><input type="checkbox" id="openOnly">Open tasks only</label>
      <button class="ctl-btn" type="button" id="collapseAll">Collapse all</button>
    </div>
  </div>
</div>
<main class="board" id="projects"></main>
<dialog id="createDlg">
  <form class="dlg-body" id="createForm" method="dialog">
    <div>
      <div class="dlg-title" id="dlgTitle"></div>
      <div class="dlg-ctx" id="dlgCtx"></div>
    </div>
    <div class="field"><label for="f-name" id="nameLabel">Name</label><input id="f-name" name="name" required maxlength="200" autocomplete="off"></div>
    <div class="field"><label for="f-slug" id="slugLabel">Slug</label><input id="f-slug" name="slug" required pattern="[a-z0-9]+(-[a-z0-9]+)*" autocomplete="off"><div class="path-preview" id="pathPreview"></div></div>
    <div class="dlg-row">
      <div class="field"><label for="f-status">Status</label><select id="f-status" name="status"></select></div>
      <div class="field" id="prioField"><label for="f-priority">Priority</label>
        <select id="f-priority" name="priority"><option>low</option><option selected>medium</option><option>high</option></select>
      </div>
    </div>
    <div class="field"><label for="f-text" id="f-text-label">Description</label><textarea id="f-text" name="text" maxlength="2000"></textarea></div>
    <div class="dlg-error" id="dlgError"></div>
    <div class="dlg-actions">
      <button value="cancel" formnovalidate>Cancel</button>
      <button value="create" id="dlgSubmit">Create</button>
    </div>
  </form>
</dialog>
<script>
const DATA = /*WAIPOINT_DATA*/{"projects":[],"generated":""}/*END_DATA*/;

const CLOSED = { done: true, dropped: true };

/* ---- view state -----------------------------------------------------
   Which work packages are collapsed, and whether the board is filtered to
   open tasks, are per-reader preferences: they live in localStorage so the
   view survives the page being rebuilt and redeployed underneath it. Every
   access is guarded -- storage throws on a file:// copy in some browsers
   and wherever site data is blocked. */

const STORE_COLLAPSED = 'waipoint.collapsed';
const STORE_OPEN_ONLY = 'waipoint.openOnly';

function readStore(key, fallback) {
  try {
    const raw = localStorage.getItem(key);
    return raw === null ? fallback : JSON.parse(raw);
  } catch { return fallback; }
}
function writeStore(key, value) {
  try { localStorage.setItem(key, JSON.stringify(value)); } catch {}
}

const collapsed = new Set(readStore(STORE_COLLAPSED, []) || []);

/* ---- latest update --------------------------------------------------
   Each project flags the single task an agent touched most recently, so a
   column answers "what moved last?" without reading every card. A pencil does
   the same for the newest manual edit made in the dashboard. */

const SPARK = '<svg class="latest-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M6 0 Q6.7 5.3 12 6 Q6.7 6.7 6 12 Q5.3 6.7 0 6 Q5.3 5.3 6 0Z"/></svg>';
const PENCIL = '<svg class="edit-icon" viewBox="0 0 12 12" aria-hidden="true"><path d="M8.5 1.5l2 2L4 10l-2.5.5L2 8z M7 3l2 2"/></svg>';

// Only the CLI writes `updated` and only the dashboard writes `edited`, so each
// stamp speaks for one side. `created` stands in for a record older than
// `updated` -- unless the dashboard made it, in which case no agent has yet.
const stamp = o => Date.parse((o && (o.updated || (!o.edited && o.created))) || '') || 0;
const editStamp = o => Date.parse((o && o.edited) || '') || 0;

/** The newest dashboard edit in a project: the project itself, a work package
 *  (`wp` set) or a task (`wp` and `task` set). */
function latestEdit(project) {
  let best = null;
  const consider = (o, where) => {
    const when = editStamp(o);
    if (when && (!best || when > best.when)) best = { when, name: o.name, ...where };
  };
  consider(project, {});
  for (const wp of project.workpackages || []) {
    consider(wp, { wp: wp.slug });
    for (const t of wp.tasks || []) consider(t, { wp: wp.slug, task: t.slug });
  }
  return best;
}

function latestTask(project) {
  let best = null;
  for (const wp of project.workpackages || []) {
    for (const t of wp.tasks || []) {
      const when = stamp(t);
      if (when && (!best || when > best.when)) best = { when, wp: wp.slug, task: t.slug, name: t.name };
    }
  }
  return best;
}

function timeAgo(ms) {
  const s = (Date.now() - ms) / 1000;
  if (s < 90) return 'just now';
  if (s < 5400) return Math.round(s / 60) + 'm ago';
  if (s < 172800) return Math.round(s / 3600) + 'h ago';
  if (s < 1209600) return Math.round(s / 86400) + 'd ago';
  return Math.round(s / 604800) + 'w ago';
}

const fullTime = ms => new Date(ms).toLocaleString('en-US', {
  month: 'short', day: 'numeric', year: 'numeric', hour: '2-digit', minute: '2-digit'
});

/* ---- routing --------------------------------------------------------
   The location hash selects the view. A project slug selects the focus view:
   that project alone, at full width, with the panels a 340px column has no
   room for. ARCHIVE selects the archive, a board of the archived projects the
   main board leaves out. Keeping the view in the URL makes it linkable and
   lets Back out. */

// Slugs are kebab-case, so no project can take this hash.
const ARCHIVE = ':archived';

let renderedFor;

const hashValue = () => decodeURIComponent(location.hash.replace(/^#/, ''));

function focusSlug() {
  const raw = hashValue();
  return raw && DATA.projects.some(p => p.slug === raw) ? raw : null;
}

const inArchive = () => hashValue() === ARCHIVE;

// The view on screen: a project slug, ARCHIVE, or null for the board.
const route = () => focusSlug() || (inArchive() ? ARCHIVE : null);

// Each view pushed on top of the board records the view it was opened from.
function openRoute(to) {
  history.pushState({ pvFocus: true, from: route() }, '', '#' + (to === ARCHIVE ? to : encodeURIComponent(to)));
  render();
  syncCollapseBtn();
  const main = document.getElementById('projects');
  main.scrollTop = 0;
  main.scrollLeft = 0;
}

const openFocus = slug => openRoute(slug);
const openArchive = () => openRoute(ARCHIVE);

// A focused project leaves for the view that lists it, the archive for the
// board. Going back keeps that view's scroll position, but only when it is
// the view this one was opened from; a link opened straight into a view has
// nothing behind it, so there the entry is replaced instead.
function exitFocus() {
  const slug = focusSlug();
  const project = slug && DATA.projects.find(p => p.slug === slug);
  const to = project && isArchived(project) ? ARCHIVE : null;
  if (history.state && history.state.pvFocus && history.state.from === to) return history.back();
  history.replaceState(null, '', location.pathname + location.search + (to ? '#' + to : ''));
  render();
  syncCollapseBtn();
}

/* ---- shared pieces --------------------------------------------------- */

const isArchived = p => p.status === 'archived';

// The newest date in a work package: an agent's write to it or one of its
// tasks, or a dashboard edit to any of them. A task write leaves the work
// package's own stamp alone, so the tasks have to be read too.
function wpTouched(wp) {
  let last = Math.max(stamp(wp), editStamp(wp));
  for (const t of wp.tasks || []) last = Math.max(last, stamp(t), editStamp(t));
  return last;
}

// The newest date anywhere in a project, the project record included.
function lastTouched(project) {
  let last = Math.max(stamp(project), editStamp(project));
  for (const wp of project.workpackages || []) last = Math.max(last, wpTouched(wp));
  return last;
}

// Active, then paused, then completed; within a group, the most recently
// touched first. The build lists projects by slug and sort is stable, so ties
// and projects without any date stay in slug order.
const projectStatusOrder = { active: 0, paused: 1, completed: 2 };
const sortProjects = projects => projects
  .map(p => ({ p, when: lastTouched(p) }))
  .sort((a, b) => (projectStatusOrder[a.p.status] ?? 0) - (projectStatusOrder[b.p.status] ?? 0)
    || b.when - a.when)
  .map(({ p }) => p);

const prioOrder = { high: 0, medium: 1, low: 2 };
const wpStatusOrder = { 'in-progress': 0, 'blocked': 1, 'planned': 2, 'done': 3 };
const taskStatusOrder = { 'current': 0, 'open': 1, 'done': 2, 'dropped': 3 };

const sortWps = wps => wps.slice().sort((a, b) =>
  (wpStatusOrder[a.status] ?? 2) - (wpStatusOrder[b.status] ?? 2)
  || (prioOrder[a.priority] ?? 1) - (prioOrder[b.priority] ?? 1));

const sortTasks = tasks => tasks.slice().sort((a, b) =>
  (taskStatusOrder[a.status] ?? 1) - (taskStatusOrder[b.status] ?? 1));

const iconCls = s => ({ done: 'task-icon-done', current: 'task-icon-current', dropped: 'task-icon-dropped' })[s] || 'task-icon-open';
const nameCls = s => ({ done: 'task-name-done', dropped: 'task-name-dropped' })[s] || '';

// A value the dashboard can change: a button that opens the edit menu when the
// write API answers, the same markup as a plain span otherwise. `rec` names the
// record the way /api/update does.
function editBtn(cls, inner, { kind, project, wp = '', task = '' }, field, value) {
  if (!WRITE) return `<span class="${cls}">${inner}</span>`;
  return `<button type="button" class="${cls} edit-trigger" data-edit="${kind}" data-project="${escAttr(project)}" data-wp="${escAttr(wp)}" data-task="${escAttr(task)}" data-field="${field}" data-value="${escAttr(value)}" aria-haspopup="menu" aria-expanded="false" aria-label="${field}: ${escAttr(value || 'unset')}" title="Change ${field}">${inner}</button>`;
}

const latestTitle = l => l ? escAttr(`Latest agent update: ${l.name} — ${fullTime(l.when)}`) : '';
const editTitle = e => e ? escAttr(`Latest manual edit: ${e.name} — ${fullTime(e.when)}`) : '';

const shaOf = url => url.split('/').pop().slice(0, 7);
const commitLink = url =>
  `<a class="commit-link" href="${escAttr(url)}" target="_blank" rel="noopener noreferrer">${esc(shaOf(url))}</a>`;

const stat = (value, label) =>
  `<div class="stat"><span class="stat-value">${value}</span><span class="stat-label">${label}</span></div>`;

const plural = (n, word) => `${word}${n === 1 ? '' : 's'}`;

// "waiting on <name>" for a blocked work package that records its blocker, by
// name when the blocker is in the project, by slug otherwise.
function waitingOn(p, wp) {
  if (wp.status !== 'blocked' || !wp.blocked_by) return '';
  const by = (p.workpackages || []).find(w => w.slug === wp.blocked_by);
  return `waiting on ${by ? by.name : wp.blocked_by}`;
}

function tally(projects) {
  let wps = 0, tasks = 0, done = 0, commits = 0, last = 0, first = 0;
  for (const p of projects) {
    const started = Date.parse(p.created || '') || 0;
    if (started && (!first || started < first)) first = started;
    for (const wp of p.workpackages || []) {
      wps++;
      for (const t of wp.tasks || []) {
        tasks++;
        if (t.status === 'done') done++;
        commits += (t.commits || []).length;
        last = Math.max(last, stamp(t));
        const born = Date.parse(t.created || '') || 0;
        if (born && (!first || born < first)) first = born;
      }
    }
  }
  return { wps, tasks, done, commits, last, first };
}

// `when` is the work package's last-touched date, shown only in the focus
// view, where it is what orders the cards in a lane.
function wpCard(p, wp, latest, edit, when = 0) {
  const tasks = wp.tasks || [];
  const done = tasks.filter(t => t.status === 'done').length;
  const openTasks = tasks.filter(t => !CLOSED[t.status]).length;
  const pct = tasks.length ? Math.round((done / tasks.length) * 100) : 0;
  const priorityCls = wp.priority === 'high' ? ' priority-high' : '';
  const key = `${p.slug}/${wp.slug}`;
  const rec = { kind: 'wp', project: p.slug, wp: wp.slug };
  const hasLatest = !!latest && latest.wp === wp.slug;
  const hasEdit = !!edit && edit.wp === wp.slug;
  const sparkMark = `<span class="latest-mark" title="${latestTitle(latest)}">${SPARK}</span>`;
  const taskHtml = sortTasks(tasks).map(t => {
    const links = (t.commits || []).map(commitLink).join('');
    const commits = links ? `<span class="task-commits">${links}</span>` : '';
    const notes = t.notes ? `<div class="task-notes">${esc(t.notes)}</div>` : '';
    const isLatest = hasLatest && latest.task === t.slug;
    const mark = (isLatest ? sparkMark : '')
      + (hasEdit && edit.task === t.slug ? `<span class="latest-mark" title="${editTitle(edit)}">${PENCIL}</span>` : '');
    const cls = `task${CLOSED[t.status] ? ' task-closed' : ''}${isLatest ? ' task-latest' : ''}`;
    const icon = editBtn(`task-icon ${iconCls(t.status)}`, '', { ...rec, kind: 'task', task: t.slug }, 'status', t.status);
    return `<li class="${cls}"><div class="task-row">${icon}<span class="task-name ${nameCls(t.status)}">${esc(t.name)}</span>${mark}${commits}</div>${notes}</li>`;
  }).join('');
  // An edit to a task is marked on the task, so the header pencil hides while
  // the card is open, like the spark. An edit to the work package itself has
  // nowhere else to show, so that pencil stays.
  const editMark = hasEdit
    ? `<span class="latest-mark${edit.task ? '' : ' latest-mark-self'}" title="${editTitle(edit)}">${PENCIL}</span>` : '';
  const status = editBtn(`badge badge-${wp.status}`, wp.status.replace('-', ' '), rec, 'status', wp.status);
  const priority = wp.priority || WRITE
    ? editBtn(`priority${priorityCls}`, wp.priority || 'priority', rec, 'priority', wp.priority || '') : '';
  const waiting = waitingOn(p, wp);
  const notes = waiting || wp.notes
    ? `<p class="wp-notes">${waiting ? `<span class="wp-blocker">${esc(waiting)}</span>` : ''}${esc(wp.notes || '')}</p>` : '';
  return `<details class="wp" data-key="${escAttr(key)}"${collapsed.has(key) ? '' : ' open'}>
    <summary class="wp-summary">
      <span class="chev"></span>
      <div class="wp-summary-main">
        <div class="wp-header"><h3 class="wp-name">${esc(wp.name)}</h3>${status}${priority}${hasLatest ? sparkMark : ''}${editMark}${WRITE ? `<button class="add-btn" data-add="task" data-project="${p.slug}" data-wp="${wp.slug}" title="Add task">+</button>` : ''}</div>
        <div class="progress-row"><div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div><span class="progress-label">${done}/${tasks.length}</span>${when ? `<span class="wp-when" title="${escAttr(`Last update: ${fullTime(when)}`)}">${timeAgo(when)}</span>` : ''}</div>
      </div>
    </summary>
    <div class="wp-body">
      ${wp.description ? `<p class="wp-desc">${esc(wp.description)}</p>` : ''}
      ${notes}
      ${tasks.length ? `<ul class="tasks">${taskHtml}</ul>` : ''}
      ${tasks.length && !openTasks ? '<div class="wp-alldone">No open tasks</div>' : ''}
    </div>
  </details>`;
}

const repoLinks = p => (p.repos || []).map(r =>
  `<a class="repo-link" href="https://github.com/${escAttr(r)}" target="_blank" rel="noopener noreferrer">${esc(r)}</a>`).join(' ');
const tagChips = p => (p.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join(' ');

/* ---- board ----------------------------------------------------------- */

const projectBadge = p =>
  editBtn(`badge badge-${p.status}`, p.status, { kind: 'project', project: p.slug }, 'status', p.status);

function projectColumn(p) {
  const latest = latestTask(p);
  const edit = latestEdit(p);
  const wps = sortWps(p.workpackages || []).map(wp => wpCard(p, wp, latest, edit)).join('');
  return `<section class="project-col">
    <div class="project-col-header focusable" data-focus="${escAttr(p.slug)}" role="button" tabindex="0" title="Open ${escAttr(p.name)}">
      <div class="project-header"><h2 class="project-name">${esc(p.name)}</h2><span class="focus-hint">&rarr;</span>${projectBadge(p)}${latest ? `<span class="latest-flag" title="${latestTitle(latest)}">${SPARK}${timeAgo(latest.when)}</span>` : ''}${edit ? `<span class="latest-flag latest-flag-edit" title="${editTitle(edit)}">${PENCIL}${timeAgo(edit.when)}</span>` : ''}${WRITE ? `<button class="add-btn" data-add="wp" data-project="${p.slug}" title="Add work package">+</button>` : ''}</div>
      ${p.description ? `<p class="project-desc">${esc(p.description)}</p>` : ''}
      <div class="project-meta">${repoLinks(p)} ${tagChips(p)}</div>
    </div>
    <div class="project-col-body">${wps}</div>
  </section>`;
}

/* ---- focus view ------------------------------------------------------ */

function overview(p, t, edit) {
  const counts = { done: 0, current: 0, open: 0, dropped: 0 };
  for (const wp of p.workpackages || []) {
    for (const task of wp.tasks || []) counts[task.status in counts ? task.status : 'open']++;
  }
  const total = t.tasks || 1;
  const seg = k => counts[k]
    ? `<span class="seg seg-${k}" style="width:${(counts[k] / total * 100).toFixed(2)}%" title="${counts[k]} ${k}"></span>` : '';
  const legend = k => counts[k]
    ? `<span class="legend"><span class="dot dot-${k}"></span>${counts[k]} ${k}</span>` : '';
  const wpCounts = {};
  for (const wp of p.workpackages || []) wpCounts[wp.status] = (wpCounts[wp.status] || 0) + 1;
  const wpChips = sortWps(Object.keys(wpCounts).map(s => ({ status: s })))
    .map(({ status }) => `<span class="badge badge-${status}">${wpCounts[status]} ${status.replace('-', ' ')}</span>`).join('');
  // p.created only moves when project.json itself is rewritten, so the earliest
  // task stands in for the start date whenever it predates the project record.
  const dates = [
    t.first ? `started ${shortDate(t.first)}` : '',
    t.last ? `last agent update ${timeAgo(t.last)} · ${fullTime(t.last)}` : '',
    edit ? `last manual edit ${timeAgo(edit.when)} · ${fullTime(edit.when)}` : ''
  ].filter(Boolean).join(' — ');
  return `<div class="overview">
    <div class="statusbar">${seg('done')}${seg('current')}${seg('open')}${seg('dropped')}</div>
    <div class="legend-row"><span class="legend-label">tasks</span>${legend('done')}${legend('current')}${legend('open')}${legend('dropped')}${wpChips ? `<span class="legend-sep"></span><span class="legend-label">work packages</span>${wpChips}` : ''}</div>
    <div class="focus-dates">${esc(dates)}</div>
  </div>`;
}

function attentionPanel(p, wps) {
  const rows = [];
  // The meta line is cut to one line, so its title carries the whole of it.
  const row = (kind, label, name, meta, wpSlug) =>
    `<button class="attn" type="button" data-goto="${escAttr(wpSlug)}"><span class="attn-kind attn-${kind}">${label}</span><span class="attn-body"><span class="attn-name">${esc(name)}</span><span class="attn-meta" title="${escAttr(meta)}">${esc(meta)}</span></span></button>`;
  for (const wp of wps) {
    if (wp.status !== 'blocked') continue;
    const meta = [waitingOn(p, wp), wp.notes].filter(Boolean).join(' — ') || 'no blocker recorded';
    rows.push(row('blocked', 'blocked', wp.name, meta, wp.slug));
  }
  for (const wp of wps) {
    for (const t of wp.tasks || []) {
      if (t.status === 'current') rows.push(row('current', 'in progress', t.name, wp.name, wp.slug));
    }
  }
  for (const wp of wps) {
    if (wp.priority !== 'high' || wp.status === 'done' || wp.status === 'blocked') continue;
    const open = (wp.tasks || []).filter(t => !CLOSED[t.status]).length;
    if (!open) continue;
    rows.push(row('high', 'high', wp.name, `${open} open ${plural(open, 'task')}`, wp.slug));
  }
  if (!rows.length) return '';
  return `<section class="panel panel-attention">
    <h3 class="panel-title">Needs attention</h3>
    <div class="attn-list">${rows.join('')}</div>
  </section>`;
}

const DAY_MS = 86400000;
const shortDate = ms => new Date(ms).toLocaleDateString('en-US', { month: 'short', day: 'numeric', year: 'numeric' });
const clockTime = ms => new Date(ms).toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });

function dayLabel(ms) {
  const day = new Date(ms); day.setHours(0, 0, 0, 0);
  const today = new Date(); today.setHours(0, 0, 0, 0);
  const diff = Math.round((today - day) / DAY_MS);
  if (diff === 0) return 'Today';
  if (diff === 1) return 'Yesterday';
  return shortDate(ms);
}

const TIMELINE_MAX = 40;

function timelinePanel(p) {
  const items = [];
  // Agents only write tasks here, but a dashboard edit can also land on a work
  // package or the project, so those get entries of their own.
  const edited = (o, name, meta, goto) => {
    const when = editStamp(o);
    if (when) items.push({ when, name, meta, goto, icon: `<span class="tl-icon">${PENCIL}</span>` });
  };
  edited(p, p.name, `project · ${p.status}`, null);
  for (const wp of p.workpackages || []) {
    edited(wp, wp.name, `work package · ${wp.status.replace('-', ' ')}${wp.priority ? ` · ${wp.priority}` : ''}`, wp.slug);
    for (const t of wp.tasks || []) {
      const when = stamp(t);
      if (when) items.push({ when, name: t.name, meta: wp.name, goto: wp.slug, icon: `<span class="task-icon ${iconCls(t.status)}"></span>` });
      edited(t, t.name, `${t.status} · ${wp.name}`, wp.slug);
    }
  }
  if (!items.length) return '';
  items.sort((a, b) => b.when - a.when);
  const shown = items.slice(0, TIMELINE_MAX);
  let html = '', day = '';
  for (const { when, name, meta, goto, icon } of shown) {
    const label = dayLabel(when);
    if (label !== day) { day = label; html += `<div class="tl-day">${esc(label)}</div>`; }
    const body = `${icon}<span class="tl-body"><span class="tl-name">${esc(name)}</span><span class="tl-meta">${esc(meta)} · ${clockTime(when)}</span></span>`;
    html += goto
      ? `<button class="tl-item" type="button" data-goto="${escAttr(goto)}">${body}</button>`
      : `<div class="tl-item">${body}</div>`;
  }
  const rest = items.length - shown.length;
  return `<section class="panel">
    <h3 class="panel-title">Recent updates<span class="panel-count">${items.length}</span></h3>
    <p class="panel-note">Agent writes to tasks, and manual edits ${PENCIL} to tasks, work packages and the project. Each shows the status it stands at now.</p>
    <div class="panel-scroll">${html}</div>
    ${rest > 0 ? `<div class="panel-more">+${rest} earlier</div>` : ''}
  </section>`;
}

const COMMIT_TASKS_MAX = 15;

function commitPanel(p) {
  const groups = [];
  let total = 0;
  for (const wp of p.workpackages || []) {
    for (const t of wp.tasks || []) {
      const commits = t.commits || [];
      if (!commits.length) continue;
      total += commits.length;
      groups.push({ when: stamp(t), t, wp, commits });
    }
  }
  if (!total) return '';
  groups.sort((a, b) => b.when - a.when);
  const shown = groups.slice(0, COMMIT_TASKS_MAX);
  const multiRepo = (p.repos || []).length > 1;
  const html = shown.map(g => `<div class="cm-group">
    <div class="cm-task">${esc(g.t.name)}</div>
    <div class="cm-links">${g.commits.map(url => multiRepo
      ? `<span class="cm-repo">${esc(url.split('/').slice(3, 5).join('/'))}</span>${commitLink(url)}`
      : commitLink(url)).join('')}</div>
  </div>`).join('');
  const rest = groups.length - shown.length;
  return `<section class="panel">
    <h3 class="panel-title">Commits<span class="panel-count">${total}</span></h3>
    <p class="panel-note">Grouped by task, most recently updated first — commit dates are not stored.</p>
    <div class="panel-scroll">${html}</div>
    ${rest > 0 ? `<div class="panel-more">+${rest} more ${plural(rest, 'task')} with commits</div>` : ''}
  </section>`;
}

function focusView(p) {
  const latest = latestTask(p);
  const edit = latestEdit(p);
  const t = tally([p]);
  const wps = sortWps(p.workpackages || []);
  return `<div class="focus-head">
    <button class="back-btn" type="button" data-exit="1">&larr; ${isArchived(p) ? 'Archived projects' : 'All projects'}</button>
    <div class="project-header"><h2 class="project-name">${esc(p.name)}</h2>${projectBadge(p)}${WRITE ? `<button class="add-btn" data-add="wp" data-project="${p.slug}" title="Add work package">+</button>` : ''}</div>
    ${p.description ? `<p class="project-desc">${esc(p.description)}</p>` : ''}
    <div class="project-meta">${repoLinks(p)} ${tagChips(p)}</div>
    ${overview(p, t, edit)}
  </div>
  <div class="focus-body">
    ${attentionPanel(p, wps)}
    ${wps.length ? kanban(p, wps, latest, edit) : '<div class="empty">No work packages yet.</div>'}
    <div class="focus-panels">${timelinePanel(p)}${commitPanel(p)}</div>
  </div>`;
}

/* One lane per status, in the order work moves through them. A lane shows
   its most recently touched work package first; sort is stable, so ties and
   work packages without any date keep their status-then-priority order. A
   status outside these four would have no lane, so it joins Planned, as it
   already sorts there. */

const LANES = ['planned', 'in-progress', 'blocked', 'done'];

function kanban(p, wps, latest, edit) {
  const lanes = Object.fromEntries(LANES.map(s => [s, []]));
  for (const wp of wps) (lanes[wp.status] || lanes.planned).push({ wp, when: wpTouched(wp) });
  return `<div class="kanban">${LANES.map(status => {
    const cards = lanes[status].sort((a, b) => b.when - a.when)
      .map(({ wp, when }) => wpCard(p, wp, latest, edit, when)).join('');
    return `<section class="kanban-lane" data-lane="${status}">
      <div class="kanban-head"><span class="badge badge-${status}">${status.replace('-', ' ')}</span><span class="kanban-count">${lanes[status].length}</span></div>
      ${cards || '<div class="kanban-empty">none</div>'}
    </section>`;
  }).join('')}</div>`;
}

/* ---- entry point ----------------------------------------------------- */

function render() {
  // Re-rendering replaces the menu's trigger. A save in flight closes it itself.
  if (editing && !editing.busy) closeMenu();
  const { projects, generated } = DATA;
  document.getElementById('generated').textContent =
    generated ? new Date(generated).toLocaleDateString('en-US', {
      month: 'short', day: 'numeric', year: 'numeric',
      hour: '2-digit', minute: '2-digit'
    }) : '';

  const slug = focusSlug();
  const archive = inArchive();
  renderedFor = route();
  if (!renderedFor && location.hash) history.replaceState(null, '', location.pathname + location.search);
  const project = slug ? projects.find(p => p.slug === slug) : null;
  const main = document.getElementById('projects');
  const stats = document.getElementById('stats');

  // In the archive the button leads back; elsewhere it only shows when there
  // is something archived to open.
  const archived = projects.filter(isArchived);
  const archiveBtn = document.getElementById('archiveBtn');
  archiveBtn.hidden = !archive && !archived.length;
  archiveBtn.textContent = archive ? '← All projects' : `Archived (${archived.length})`;

  if (project) {
    const t = tally([project]);
    const edit = latestEdit(project);
    stats.innerHTML = stat(t.wps, plural(t.wps, 'work package'))
      + stat(`${t.done}/${t.tasks}`, 'tasks done')
      + (t.commits ? stat(t.commits, plural(t.commits, 'commit')) : '')
      + (t.last ? stat(timeAgo(t.last), 'last agent update') : '')
      + (edit ? stat(timeAgo(edit.when), 'last manual edit') : '');
    main.className = 'focus';
    main.innerHTML = focusView(project);
    return;
  }

  const shown = sortProjects(archive ? archived : projects.filter(p => !isArchived(p)));
  const t = tally(shown);
  stats.innerHTML = stat(shown.length, `${archive ? 'archived ' : ''}${plural(shown.length, 'project')}`)
    + stat(t.wps, plural(t.wps, 'work package'))
    + stat(`${t.done}/${t.tasks}`, 'tasks done');
  main.className = 'board';
  let empty = '<div class="empty">No projects yet. Run <code>waipoint init-project &lt;slug&gt;</code> to start.</div>';
  if (archive) empty = '<div class="empty">No archived projects.</div>';
  else if (archived.length) empty = `<div class="empty">No active projects.<button class="ctl-btn" type="button" data-archive="1">Archived (${archived.length})</button></div>`;
  main.innerHTML = shown.length ? shown.map(projectColumn).join('') : empty;
}
function esc(s) { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; }
// esc() leaves quotes alone, which is fine inside an element but would break
// out of a double-quoted attribute -- task names really do contain quotes.
function escAttr(s) { return esc(s).replace(/"/g, '&quot;'); }

/* ---- write support --------------------------------------------------
   The same page is opened three ways: as a local file, as a static host
   with no API, and behind Cloudflare Access with the /api/* writes available.
   Only the last one gets the "+" buttons and the inline editors, so a file://
   copy stays a read-only snapshot instead of showing controls that cannot work. */

let WRITE = false;

async function detectWriteApi() {
  if (!location.protocol.startsWith('http')) return false;
  try {
    const r = await fetch('/api/create', { method: 'OPTIONS' });
    return r.status === 204;
  } catch { return false; }
}

const slugify = s => s.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g, '')
  .replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '').slice(0, 60);

const WP_STATUS = ['planned', 'in-progress', 'blocked', 'done'];
const TASK_STATUS = ['open', 'current', 'done', 'dropped'];

const dlg = document.getElementById('createDlg');
const form = document.getElementById('createForm');
let pending = null;
let slugTouched = false;

function openCreate({ kind, project, wp }) {
  pending = { kind, project, wp };
  const isWp = kind === 'wp';
  document.getElementById('dlgTitle').textContent = isWp ? 'New work package' : 'New task';
  document.getElementById('dlgCtx').textContent = isWp ? project : `${project} / ${wp}`;
  const noun = isWp ? 'work package' : 'task';
  document.getElementById('nameLabel').textContent = `${noun} name`;
  document.getElementById('slugLabel').innerHTML =
    `${noun} slug &mdash; permanent, used by the CLI`;
  document.getElementById('prioField').hidden = !isWp;
  document.getElementById('f-text-label').textContent = isWp ? 'Description' : 'Notes';
  const sel = document.getElementById('f-status');
  sel.innerHTML = (isWp ? WP_STATUS : TASK_STATUS)
    .map(v => `<option${v === (isWp ? 'planned' : 'open') ? ' selected' : ''}>${v}</option>`).join('');
  form.reset();
  slugTouched = false;
  document.getElementById('dlgError').textContent = '';
  updatePathPreview();
  dlg.showModal();
  document.getElementById('f-name').focus();
}

// Show where the record will actually land -- the slug is the path segment,
// and unlike the name it cannot be changed afterwards.
function updatePathPreview() {
  const slug = document.getElementById('f-slug').value || '\u2026';
  const path = pending.kind === 'wp'
    ? `projects/${pending.project}/<b>${esc(slug)}</b>/workpackage.json`
    : `projects/${pending.project}/${pending.wp}/tasks/<b>${esc(slug)}</b>.json`;
  document.getElementById('pathPreview').innerHTML = path;
}

// Keep the slug in step with the name until the user edits it by hand
// (reset per dialog in openCreate, not once per session).
document.getElementById('f-slug').addEventListener('input', () => {
  slugTouched = true; updatePathPreview();
});
document.getElementById('f-name').addEventListener('input', e => {
  if (!slugTouched) document.getElementById('f-slug').value = slugify(e.target.value);
  updatePathPreview();
});

document.getElementById('projects').addEventListener('click', e => {
  const trigger = e.target.closest('.edit-trigger');
  if (trigger) {
    // As with "+": in a <summary> the click would fold the card, and in a
    // project header it would open the focus view.
    e.preventDefault();
    if (editing && editing.trigger === trigger && !editing.busy) closeMenu();
    else openMenu(trigger);
    return;
  }
  const btn = e.target.closest('.add-btn');
  if (btn) {
    // The "+" sits inside a <summary>, where the click would otherwise fold
    // the work package on its way to opening the dialog.
    e.preventDefault();
    openCreate({ kind: btn.dataset.add, project: btn.dataset.project, wp: btn.dataset.wp });
    return;
  }
  if (e.target.closest('[data-exit]')) return exitFocus();
  if (e.target.closest('[data-archive]')) return openArchive();
  const goto = e.target.closest('[data-goto]');
  if (goto) return revealWp(goto.dataset.goto);
  const head = e.target.closest('[data-focus]');
  // A click that ends a drag over the description is a text selection, not a
  // request to open the project.
  const selecting = !window.getSelection().isCollapsed;
  if (head && !selecting && !e.target.closest('a')) openFocus(head.dataset.focus);
});

// A panel row points at the work package it came from: open it, scroll it into
// view, and flash it, so the jump is visible rather than a silent scroll.
function revealWp(wpSlug) {
  const card = [...document.querySelectorAll('details.wp')]
    .find(d => d.dataset.key.endsWith('/' + wpSlug));
  if (!card) return;
  card.open = true;
  card.scrollIntoView({ behavior: 'smooth', block: 'center' });
  card.classList.remove('flash');
  void card.offsetWidth;   // restart the animation on a repeat click
  card.classList.add('flash');
}

form.addEventListener('submit', async e => {
  if (e.submitter && e.submitter.value === 'cancel') return;
  e.preventDefault();
  const btn = document.getElementById('dlgSubmit');
  const err = document.getElementById('dlgError');
  const fd = new FormData(form);
  const isWp = pending.kind === 'wp';

  const payload = {
    kind: pending.kind,
    project: pending.project,
    wp: isWp ? fd.get('slug') : pending.wp,
    name: fd.get('name'),
    status: fd.get('status'),
    ...(isWp
      ? { priority: fd.get('priority'), description: fd.get('text') }
      : { task: fd.get('slug'), notes: fd.get('text') })
  };

  btn.disabled = true; err.textContent = '';
  try {
    const res = await fetch('/api/create', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify(payload)
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || `request failed (${res.status})`);
    applyCreated(payload, body);
    dlg.close();
    render();
    syncCollapseBtn();
  } catch (ex) {
    err.textContent = ex.message;
  } finally {
    btn.disabled = false;
  }
});

/* The page's data was baked in at build time, so fold the new record into it
   rather than reloading -- a reload would still serve the pre-write build. */
function applyCreated(payload, body) {
  const project = DATA.projects.find(p => p.slug === payload.project);
  if (!project) return;
  if (payload.kind === 'wp') {
    project.workpackages = project.workpackages || [];
    project.workpackages.push({ slug: body.slug, ...body.doc, tasks: [] });
  } else {
    const wp = (project.workpackages || []).find(w => w.slug === payload.wp);
    if (!wp) return;
    wp.tasks = wp.tasks || [];
    wp.tasks.push({ slug: body.slug, ...body.doc });
  }
}

/* ---- inline edits ---------------------------------------------------
   A status or priority changes in place: its button opens a menu of the
   allowed values, and the pick goes to /api/update. The Worker applies it to
   the record as it stands in the repo, not to this page's build-time copy,
   and returns the whole record to replace that copy. */

const PROJECT_STATUS = ['active', 'paused', 'completed', 'archived'];
const PRIORITY = ['low', 'medium', 'high'];
const CHOICES = {
  project: { status: PROJECT_STATUS },
  wp: { status: WP_STATUS, priority: PRIORITY },
  task: { status: TASK_STATUS }
};

const menu = document.createElement('div');
menu.className = 'edit-menu';
menu.setAttribute('role', 'menu');
menu.hidden = true;
document.body.appendChild(menu);

// { trigger, rec, field, busy } while the menu is open.
let editing = null;

function optionLook(kind, field, v) {
  if (field === 'priority') return `<span class="priority${v === 'high' ? ' priority-high' : ''}">${v}</span>`;
  if (kind === 'task') return `<span class="task-icon ${iconCls(v)}"></span>${v}`;
  return `<span class="badge badge-${v}">${v.replace('-', ' ')}</span>`;
}

function openMenu(trigger) {
  if (editing && editing.busy) return;
  closeMenu();
  const { edit: kind, project, wp, task, field, value } = trigger.dataset;
  editing = { trigger, rec: { kind, project, wp, task }, field, busy: false };
  menu.innerHTML = CHOICES[kind][field].map(v =>
    `<button type="button" class="edit-opt" role="menuitemradio" aria-checked="${v === value}" data-value="${v}">${optionLook(kind, field, v)}</button>`
  ).join('') + '<div class="edit-menu-msg" hidden></div>';
  menu.hidden = false;
  trigger.setAttribute('aria-expanded', 'true');
  // Below the trigger, or above it when below would run off the viewport.
  const r = trigger.getBoundingClientRect();
  const top = r.bottom + 4 + menu.offsetHeight > innerHeight ? r.top - 4 - menu.offsetHeight : r.bottom + 4;
  menu.style.top = `${Math.max(8, top)}px`;
  menu.style.left = `${Math.max(8, Math.min(r.left, innerWidth - menu.offsetWidth - 8))}px`;
  (menu.querySelector('[aria-checked="true"]') || menu.querySelector('.edit-opt')).focus();
}

function closeMenu({ restoreFocus = false } = {}) {
  if (!editing) return;
  const { trigger } = editing;
  editing = null;
  menu.hidden = true;
  trigger.setAttribute('aria-expanded', 'false');
  if (restoreFocus && trigger.isConnected) trigger.focus();
}

menu.addEventListener('click', async e => {
  const opt = e.target.closest('.edit-opt');
  const current = editing;
  if (!opt || !current || current.busy) return;
  if (opt.dataset.value === current.trigger.dataset.value) return closeMenu({ restoreFocus: true });

  const opts = menu.querySelectorAll('.edit-opt');
  const msg = menu.querySelector('.edit-menu-msg');
  current.busy = true;
  opts.forEach(b => { b.disabled = true; });
  msg.hidden = false;
  msg.classList.remove('error');
  msg.textContent = 'Saving…';
  try {
    const res = await fetch('/api/update', {
      method: 'POST',
      headers: { 'content-type': 'application/json' },
      body: JSON.stringify({ ...current.rec, field: current.field, value: opt.dataset.value })
    });
    const body = await res.json();
    if (!res.ok) throw new Error(body.error || `request failed (${res.status})`);
    applyUpdated(current.rec, body.doc);
    closeMenu();
    render();
    syncCollapseBtn();
  } catch (ex) {
    // Nothing closes the menu mid-save, so it is still ours to report into.
    current.busy = false;
    opts.forEach(b => { b.disabled = false; });
    msg.classList.add('error');
    msg.textContent = ex.message;
  }
});

menu.addEventListener('keydown', e => {
  if (e.key === 'Tab') {
    if (!editing.busy) closeMenu({ restoreFocus: true });
    return;
  }
  if (e.key !== 'ArrowDown' && e.key !== 'ArrowUp') return;
  e.preventDefault();
  const opts = [...menu.querySelectorAll('.edit-opt:not([disabled])')];
  if (!opts.length) return;
  const i = opts.indexOf(document.activeElement);
  const next = e.key === 'ArrowDown' ? i + 1 : (i < 0 ? opts.length : i) - 1;
  opts[(next + opts.length) % opts.length].focus();
});

// Light dismiss: a press anywhere else, a scroll or a resize closes the menu --
// never mid-save, so a failure still has somewhere to show.
const dismissMenu = () => { if (editing && !editing.busy) closeMenu(); };
document.addEventListener('pointerdown', e => {
  if (editing && !menu.contains(e.target) && !editing.trigger.contains(e.target)) dismissMenu();
}, true);
document.addEventListener('scroll', dismissMenu, true);
window.addEventListener('resize', dismissMenu);

/* The Worker's doc is the whole record as the repo has it now, so it also
   brings in anything an agent wrote to this record since the page was built. */
function applyUpdated({ kind, project, wp, task }, doc) {
  let rec = DATA.projects.find(p => p.slug === project);
  if (rec && kind !== 'project') rec = (rec.workpackages || []).find(w => w.slug === wp);
  if (rec && kind === 'task') rec = (rec.tasks || []).find(t => t.slug === task);
  if (!rec) return;
  // A field the Worker removed (a cleared blocked_by) has to go here too.
  if (kind === 'wp' && !('blocked_by' in doc)) delete rec.blocked_by;
  Object.assign(rec, doc);
}

document.getElementById('projects').addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const head = e.target.closest('[data-focus]');
  // The header itself only: Enter on a button inside it belongs to that button.
  if (!head || e.target !== head) return;
  e.preventDefault();
  openFocus(head.dataset.focus);
});

document.addEventListener('keydown', e => {
  if (e.key !== 'Escape' || dlg.open) return;
  // Esc closes an open edit menu first; only the next one leaves the project.
  if (editing) { if (!editing.busy) closeMenu({ restoreFocus: true }); return; }
  if (route()) exitFocus();
});

// pushState does not fire either event; these cover Back, Forward and a hash
// typed into the address bar.
const routeChanged = () => { if (route() !== renderedFor) { render(); syncCollapseBtn(); } };
window.addEventListener('popstate', routeChanged);
window.addEventListener('hashchange', routeChanged);

document.getElementById('archiveBtn').addEventListener('click', () => {
  if (inArchive()) exitFocus(); else openArchive();
});

/* ---- view controls --------------------------------------------------- */

const board = document.getElementById('projects');
const collapseBtn = document.getElementById('collapseAll');
const openOnlyBox = document.getElementById('openOnly');

// 'toggle' does not bubble, so listen for it on the way down instead.
board.addEventListener('toggle', e => {
  const wp = e.target;
  if (!wp.classList || !wp.classList.contains('wp')) return;
  if (wp.open) collapsed.delete(wp.dataset.key); else collapsed.add(wp.dataset.key);
  writeStore(STORE_COLLAPSED, [...collapsed]);
  syncCollapseBtn();
}, true);

function syncCollapseBtn() {
  const all = board.querySelectorAll('details.wp');
  collapseBtn.disabled = all.length === 0;
  collapseBtn.textContent = [...all].some(wp => wp.open) ? 'Collapse all' : 'Expand all';
}

collapseBtn.addEventListener('click', () => {
  const all = [...board.querySelectorAll('details.wp')];
  const open = !all.some(wp => wp.open);   // nothing left open -> expand instead
  all.forEach(wp => { wp.open = open; });  // each fires 'toggle', which persists it
  syncCollapseBtn();
});

openOnlyBox.checked = readStore(STORE_OPEN_ONLY, false) === true;
applyOpenOnly();
openOnlyBox.addEventListener('change', () => {
  applyOpenOnly();
  writeStore(STORE_OPEN_ONLY, openOnlyBox.checked);
});

// Filtering is a class on <body> rather than a re-render: the markup marks
// every closed task, so the view flips without disturbing anything else.
function applyOpenOnly() {
  document.body.classList.toggle('open-only', openOnlyBox.checked);
}

render();
syncCollapseBtn();
detectWriteApi().then(ok => { if (ok) { WRITE = true; render(); syncCollapseBtn(); } });
</script>
</body>
</html>
